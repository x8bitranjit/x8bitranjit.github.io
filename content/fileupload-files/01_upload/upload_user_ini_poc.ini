; ============================================================================
; Safe PoC -> x8bitranjit
; PHP .user.ini config-upload PoC - x8bitranjit lab style. Authorized testing only.
;
; WHAT THIS DEMONSTRATES: on PHP-CGI/FPM with user_ini.filename enabled
; (default .user.ini), dropping a .user.ini into a SERVED directory makes
; EVERY PHP request in that directory auto-include your file first -
; turning an inert uploaded image into executed PHP. This is the standard
; bypass when .php uploads are blocked but .gif/.jpg land in a PHP-served dir.
;
; WHERE TO USE: PHP stacks (nginx+PHP-FPM, CGI). Upload this file (named
; exactly ".user.ini") into the upload dir, wait user_ini.cache_ttl
; (default 300s) or restart FPM, then trigger any .php in that directory -
; your polyglot image executes first.
;
; WHAT TO EDIT:
;   - The filename below must match YOUR uploaded polyglot (default assumes
;     upload_polyglot_gif_php.gif from this folder, uploaded as-is).
;   - nothing else - shipped benign (marker echo only).
;
; CONFIRM: GET any existing .php in the same directory -> marker text prepends.
; PAIRS WITH: upload_polyglot_gif_php.gif / upload_png_php_polyglot.png.
; NGINX+PHP-FPM alternate: path_info trick - GET /uploads/x.jpg/x.php
; (no config file needed when cgi.fix_pathinfo=1).
; KIT CROSS-REF: UPL-009, UPL-010.
; ============================================================================

auto_prepend_file = upload_polyglot_gif_php.gif
